name: Deploy Worker
on:
  push:
    branches:
      - main  # Only deploys when you push to the main branch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # This ensures it uses your exact wrangler.toml settings
